name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release

    env:
      SHELLEY_NO_UPDATE_CHECK: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history, to check the tag is on main

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release from main only."
            exit 1
          fi

      - name: Check versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' shelley/__init__.py)
          cff=$(sed -n 's/^version: //p' CITATION.cff)
          echo "tag=$tag  __version__=$pkg  CITATION.cff=$cff"
          status=0
          if [ "$pkg" != "$tag" ]; then
            echo "::error file=shelley/__init__.py::__version__ is $pkg, tag is $tag"
            status=1
          fi
          if [ "$cff" != "$tag" ]; then
            echo "::error file=CITATION.cff::version is $cff, tag is $tag"
            status=1
          fi
          exit $status

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error file=CHANGELOG.md::No '## [$tag]' section found"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          # The wheel declares a bare `container-guts`, which on PyPI is upstream,
          # not our fork. Pin the fork as `uv tool install git+...` would.
          # Keep in sync with [tool.uv.sources] in pyproject.toml.
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl \
            "container-guts @ git+https://github.com/Sydney-Informatics-Hub/guts.git@singularity"
          cd "$RUNNER_TEMP"  # away from the checkout, so the source tree is not importable
          smoke/bin/shelley --version
          smoke/bin/shelley find fastqc > /dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
