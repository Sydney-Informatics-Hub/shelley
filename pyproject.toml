[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelley"
dynamic = ["version"]
description = "A bioinformatics tool finder and module builder for CVMFS-hosted containers on BioShell"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Frederick Jaya"},
    {name = "Mitchell O'Brien"},
    {name = "Georgie Samaha"},
]
keywords = ["bioinformatics", "cvmfs", "singularity", "lmod", "containers", "bioshell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rich>=13.0",
    "packaging>=21",
    "container-guts",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff>=0.16,<0.17",
    "mypy",
]

[project.scripts]
shelley = "shelley.client.cli:main"
shelley-build-rsec = "shelley.scripts.build_rsec_meta:main"
shelley-build-galaxy = "shelley.scripts.build_galaxy_cache:main"

[project.urls]
Homepage = "https://github.com/Sydney-Informatics-Hub/shelley"
Documentation = "https://github.com/Sydney-Informatics-Hub/shelley/tree/main/docs"
"Bug Reports" = "https://github.com/Sydney-Informatics-Hub/shelley/issues"
Source = "https://github.com/Sydney-Informatics-Hub/shelley"
Changelog = "https://github.com/Sydney-Informatics-Hub/shelley/blob/main/CHANGELOG.md"

[tool.uv.sources]
container-guts = { git = "https://github.com/Sydney-Informatics-Hub/guts.git", branch = "singularity" }

[tool.hatch.version]
path = "shelley/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["shelley"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests insert project root on sys.path before importing shelley

[tool.ruff.lint.isort]
known-first-party = ["shelley"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
